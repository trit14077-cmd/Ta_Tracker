# Deploy Edge Functions lên Supabase DEV (PO chọn 19/11/2026). Chỉ chạy khi bấm tay: Actions > deploy-dev > Run workflow.
# Cần:
#   - Secret  SUPABASE_ACCESS_TOKEN       (Supabase Dashboard > Account > Access Tokens; KHÔNG dán vào chat/Git)
#   - Variable SUPABASE_DEV_PROJECT_REF   (Settings > Secrets and variables > Actions > Variables; mã project DEV)
# Không đụng database (migration vẫn áp riêng). Không deploy production.
name: deploy-dev
on:
  workflow_dispatch:
    inputs:
      function:
        description: "Tên function (để trống = tất cả)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: deploy-dev
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_DEV_PROJECT_REF }}
      FN: ${{ inputs.function }}
    steps:
      - uses: actions/checkout@v6
      - name: Kiểm tra cấu hình
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Thiếu secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          [ -n "$PROJECT_REF" ] || { echo "::error::Thiếu variable SUPABASE_DEV_PROJECT_REF"; exit 1; }
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.4
      - name: Kiểm kiểu trước khi deploy
        run: deno check supabase/functions/*/index.ts
      - uses: supabase/setup-cli@v3.1.0
        with:
          version: 2.120.0
      - name: Deploy (bundle trên server, kèm thư viện shared/)
        run: |
          if [ -n "$FN" ]; then
            supabase functions deploy "$FN" --project-ref "$PROJECT_REF" --use-api
          else
            supabase functions deploy --project-ref "$PROJECT_REF" --use-api
          fi
      - name: Danh sách function sau deploy
        run: supabase functions list --project-ref "$PROJECT_REF"
