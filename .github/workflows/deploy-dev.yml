# Deploy Edge Functions lên Supabase DEV (PO chọn 19/11/2026). Chỉ chạy khi bấm tay: Actions > deploy-dev > Run workflow.
# Cần:
#   - Secret  SUPABASE_ACCESS_TOKEN       (Supabase Dashboard > Account > Access Tokens; KHÔNG dán vào chat/Git)
#   - Variable SUPABASE_DEV_PROJECT_REF   (Settings > Secrets and variables > Actions > Variables; mã project DEV)
# Không đụng database (migration vẫn áp riêng). Không deploy production.
name: deploy-dev
on:
  workflow_dispatch:
    inputs:
      function:
        description: "Tên function (để trống = tất cả)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: deploy-dev
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_DEV_PROJECT_REF }}
      FN: ${{ inputs.function }}
    steps:
      - uses: actions/checkout@v6
      - name: Kiểm tra cấu hình
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Thiếu secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          [ -n "$PROJECT_REF" ] || { echo "::error::Thiếu variable SUPABASE_DEV_PROJECT_REF"; exit 1; }
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.4
      - name: Kiểm kiểu trước khi deploy
        run: deno check --node-modules-dir=none --no-lock supabase/functions/*/index.ts
      - uses: supabase/setup-cli@v3.1.0
        with:
          version: 2.120.0
      - name: Deploy (bundle trên server, kèm thư viện shared/)
        # Function công khai (người chưa đăng nhập gọi bằng khóa publishable – không phải JWT) phải tắt kiểm JWT ở cổng,
        # nếu không cổng trả 401 trước khi vào code. Chúng tự chống lạm dụng (apply: rate_limits + honeypot + mã link).
        # Mọi function khác giữ verify_jwt và còn tự kiểm getUser bên trong.
        env:
          PUBLIC_FNS: "apply"
        run: |
          deploy_one() {
            local extra=""
            case " $PUBLIC_FNS " in *" $1 "*) extra="--no-verify-jwt" ;; esac
            echo "== deploy $1 $extra"
            supabase functions deploy "$1" --project-ref "$PROJECT_REF" --use-api $extra
          }
          if [ -n "$FN" ]; then
            [ -f "supabase/functions/$FN/index.ts" ] || { echo "::error::Không có function $FN"; exit 1; }
            deploy_one "$FN"
          else
            for d in supabase/functions/*/; do
              [ -f "$d/index.ts" ] && deploy_one "$(basename "$d")"
            done
          fi
      - name: Danh sách function sau deploy
        run: supabase functions list --project-ref "$PROJECT_REF"
