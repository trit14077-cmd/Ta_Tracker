name: ci
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    name: Chặn bí mật / dữ liệu thật
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/ci/guard.sh

  node:
    name: Typecheck, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # quét lộ khóa trong TOÀN BỘ lịch sử Git (M9-3)
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Build frontend (typecheck strict + vite build)
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Quét lộ khóa – bundle frontend + lịch sử Git (M9-3; chỉ in tên mẫu, không in giá trị)
        run: npx tsx scripts/security/secretScan.ts --bundle frontend/dist --history

  edge:
    name: Kiểm kiểu Edge Functions (Deno)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.4
      - run: deno check --node-modules-dir=none --no-lock supabase/functions/*/index.ts

  python:
    name: Kiểm cú pháp script ETL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/etl/*.py scripts/ops/*.py

  db:
    name: Migrations + test RLS (Postgres 17 trống)
    runs-on: ubuntu-24.04
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: citest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # DB tạm của CI, mật khẩu không bí mật
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: citest
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v6
      - name: Nền Supabase tối thiểu (role, auth.uid, extensions)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/ci_stubs.sql
      - name: Áp toàn bộ migrations theo thứ tự
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Test RLS (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql 2>&1 | tee rls.log
          grep -q "RLS_TEST_PASSED" rls.log
      - name: Quét catalog bảo mật (M9-4) – RLS, security_invoker, search_path, quyền anon/authenticated
        run: |
          psql -v ON_ERROR_STOP=1 -AtF ' | ' -f supabase/tests/security_audit.sql > secaudit.txt
          if [ -s secaudit.txt ]; then echo "::error::Vi phạm checklist bảo mật:"; cat secaudit.txt; exit 1; fi
          echo "SECURITY_AUDIT_PASSED"
      - name: Test RPC ghi hồ sơ (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rpc_test.sql 2>&1 | tee rpc.log
          grep -q "RPC_TEST_PASSED" rpc.log
      - name: Test phân trang & lọc ứng viên (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/candidate_list_test.sql 2>&1 | tee clist.log
          grep -q "CANDIDATE_LIST_TEST_PASSED" clist.log
      - name: SQL khớp logic hệ cũ trên golden fixture (rr_board_col/sub, rr_tenor)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/sql_parity_test.sql 2>&1 | tee parity.log
          grep -q "SQL_PARITY_TEST_PASSED" parity.log
      - name: RPC báo cáo khớp dashboardCalc trên golden fixture (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/report_parity_test.sql 2>&1 | tee report.log
          grep -q "REPORT_PARITY_TEST_PASSED" report.log
      - name: Kanban (board_page/board_cards/stage_history) khớp boardPosition trên golden (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/board_test.sql 2>&1 | tee board.log
          grep -q "BOARD_TEST_PASSED" board.log
      - name: Công việc, phỏng vấn, lịch, target (0015) như Ops.gs (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ops_test.sql 2>&1 | tee ops.log
          grep -q "OPS_TEST_PASSED" ops.log
      - name: Chuông nhắc việc (0017) – giai đoạn khớp currentStage trên golden (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/alerts_test.sql 2>&1 | tee alerts.log
          grep -q "ALERTS_TEST_PASSED" alerts.log
      - name: HR Info (0018) – ghi qua Edge, trùng CCCD che PIC khác (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/hr_test.sql 2>&1 | tee hr.log
          grep -q "HR_TEST_PASSED" hr.log
      - name: Nhật ký (0019) – mỗi trường một dòng như hệ cũ, quyền xem (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/audit_test.sql 2>&1 | tee audit.log
          grep -q "AUDIT_TEST_PASSED" audit.log
      - name: Quản trị Drop-list / đề xuất / View (0020) – chỉ Admin, đổi tên lan sang hồ sơ (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/admin_test.sql 2>&1 | tee admin.log
          grep -q "ADMIN_TEST_PASSED" admin.log
      - name: Nhập Excel (0021) – không ghi đè, chỉ Admin, nhật ký từng dòng (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/import_test.sql 2>&1 | tee import.log
          grep -q "IMPORT_TEST_PASSED" import.log
      - name: File trên Drive (0022) – quyền hồ sơ, 1 file/giấy tờ, ≤20 đính kèm, nhật ký (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/files_test.sql 2>&1 | tee files.log
          grep -q "FILES_TEST_PASSED" files.log
      - name: Bản tiếng Anh (0023) – quyền hồ sơ, cần bản gốc, nhật ký TRANSLATION (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/translations_test.sql 2>&1 | tee trans.log
          grep -q "TRANSLATIONS_TEST_PASSED" trans.log
      - name: Ứng tuyển online (0024) – link theo TA, chống spam, hộp thư theo quyền, tạo hồ sơ + gắn CV (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/applications_test.sql 2>&1 | tee apps.log
          grep -q "APPLICATIONS_TEST_PASSED" apps.log
      - name: Nhật ký 12 tháng (0026) – chỉ xóa dòng đã xuất, chỉ Admin (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/audit_purge_test.sql 2>&1 | tee purge.log
          grep -q "AUDIT_PURGE_TEST_PASSED" purge.log
      - name: Mã ghế (0038, 0039) – RLS theo TA, luồng trạng thái, cấp mã liên tiếp, nhật ký (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/seat_test.sql 2>&1 | tee seat.log
          grep -q "SEAT_TEST_PASSED" seat.log
      - name: Chốt OB CnB (0040) – kỳ 25→24, điều kiện, chốt / mở lại / bổ sung / kiểm hồ sơ (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/cnb_test.sql 2>&1 | tee cnb.log
          grep -q "CNB_TEST_PASSED" cnb.log
      - name: Bonus hàng tháng (0045+) – RLS, chốt / mở lại, chống trả hai lần (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bonus_test.sql 2>&1 | tee bonus.log
          grep -q "BONUS_TEST_PASSED" bonus.log
      - name: Bonus Sign-on (0046) – scheme, cờ từng mốc, khóa mốc đã chốt (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bonus_signon_test.sql 2>&1 | tee bonus_signon.log
          grep -q "BONUS_SIGNON_TEST_PASSED" bonus_signon.log
      - name: Bonus TA Credit (0047) – hồ sơ bonus TA, cấu hình, TA xem khoản của mình (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bonus_ta_credit_test.sql 2>&1 | tee bonus_ta_credit.log
          grep -q "BONUS_TA_CREDIT_TEST_PASSED" bonus_ta_credit.log
      - name: Bonus Onsite (0048) – ngày onsite × TA, khóa khi kỳ đã chốt, TA xem ngày của mình (tự rollback)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bonus_onsite_test.sql 2>&1 | tee bonus_onsite.log
          grep -q "BONUS_ONSITE_TEST_PASSED" bonus_onsite.log
      - name: 20 phiên đồng thời tạo mã cùng PIC không trùng
        run: bash supabase/tests/concurrency_codes.sh

  perf:
    name: Hiệu năng truy vấn (20.000 hồ sơ giả)
    runs-on: ubuntu-24.04
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: citest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: citest
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v6
      - name: Nền Supabase + migrations
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/ci_stubs.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Sinh 20.000 hồ sơ giả
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/perf_seed.sql
      - name: Đo truy vấn (ngưỡng 200 ms)
        run: |
          set +e
          psql -v ON_ERROR_STOP=1 -f supabase/tests/perf_test.sql 2>&1 | tee perf.log
          code=${PIPESTATUS[0]}
          { echo "### Hiệu năng truy vấn – 20.000 hồ sơ giả (ms, 5 lần đo)"; echo;
            echo "A = policy hiện hành, B = rr_read viết lại (chỉ để so sánh)"; echo;
            cat perf_summary.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
